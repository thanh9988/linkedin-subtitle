<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 220px; padding: 12px; font-family: 'Segoe UI', sans-serif; font-size: 13px; }
    h3 { margin: 0 0 10px; font-size: 14px; }
    .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    button { width: 100%; padding: 6px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #0a66c2; color: #fff; font-size: 13px; }
    button:hover { background: #004182; }
    .toggle { position: relative; width: 40px; height: 22px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle .slider { position: absolute; inset: 0; background: #ccc; border-radius: 22px; cursor: pointer; transition: 0.2s; }
    .toggle .slider::before { content: ''; position: absolute; width: 16px; height: 16px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: 0.2s; }
    .toggle input:checked + .slider { background: #0a66c2; }
    .toggle input:checked + .slider::before { transform: translateX(18px); }
  </style>
</head>
<body>
  <h3>🎬 LLS Subtitle</h3>
  <div class="row">
    <span>Enabled</span>
    <label class="toggle">
      <input type="checkbox" id="toggle-enabled" checked>
      <span class="slider"></span>
    </label>
  </div>
  <button id="btn-settings">⚙️ Style Settings</button>
  <script src="popup.js"></script>
</body>
</html>
